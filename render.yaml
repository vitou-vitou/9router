# Blueprint for Render. Persistence of SQLite:
#   A) Paid: Starter + disk at /app/data
#   B) Free: set SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY (Storage sync)
services:
  - type: web
    name: 9router
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /dashboard
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: DATA_DIR
        value: /app/data
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_PASSWORD
        sync: false
      - key: API_KEY_SECRET
        generateValue: true
      - key: MACHINE_ID_SALT
        generateValue: true
      - key: NEXT_PUBLIC_BASE_URL
        value: https://ninerouter-su8o.onrender.com
      - key: BASE_URL
        value: https://ninerouter-su8o.onrender.com
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: ENABLE_REQUEST_LOGS
        value: "false"
      - key: OBSERVABILITY_ENABLED
        value: "true"
      - key: REQUIRE_API_KEY
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
